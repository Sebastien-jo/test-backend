name: primmo-backend

services:
  api:
    build: .
    # Apply migrations before serving. Simple and correct for this project; in
    # production this belongs in a dedicated migration job/init-container run once
    # before rollout, not on every replica start (see README).
    command: sh -c "alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: .
    # Thread pool: the mocked steps are time.sleep (IO-bound-like), so a thread
    # pool holds far more concurrent tasks than prefork at equal memory.
    # --quiet (a global option, before `worker`) suppresses Celery's ASCII startup
    # banner — printed straight to stdout, bypassing logging — so worker output is
    # a single JSON stream. Task logs still honor --loglevel.
    command: >-
      celery -A app.workers.celery_app --quiet worker
      --pool=threads --concurrency=${CELERY_WORKER_CONCURRENCY:-32} --loglevel=info
    env_file: .env
    # Distinguishes worker logs/metrics from the API's (Datadog `service` tag).
    environment:
      SERVICE_NAME: docpipe-worker
    volumes:
      - ./app:/app/app
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -t 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-primmo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-primmo}
      POSTGRES_DB: ${POSTGRES_DB:-primmo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-primmo} -d ${POSTGRES_DB:-primmo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  uploads_data:
